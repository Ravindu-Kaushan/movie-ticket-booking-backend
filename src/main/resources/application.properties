spring.application.name=movie-ticket-booking

# MySQL Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_ticket_booking}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# JWT Config
app.jwt.secret=${JWT_SECRET:ChangeThisDefaultSecretKeyForDevelopmentOnly1234567890}
app.jwt.expiration-ms=86400000